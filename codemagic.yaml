workflows:
  ios-release:
    name: iOS — build y subida a TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Nombre del grupo de integración "App Store Connect" que se crea en
      # Codemagic → Team settings → Integrations → App Store Connect,
      # usando una API Key de App Store Connect con rol "App Manager"
      # (la misma clase de clave que ya generamos para RevenueCat:
      # Users and Access → Integrations → App Store Connect API).
      app_store_connect: forzaai_asc
    environment:
      xcode: latest
      node: 22.13.0
      groups:
        # Contiene CERTIFICATE_PRIVATE_KEY: la clave RSA que
        # app-store-connect fetch-signing-files usa para generar un
        # certificado de distribución nuevo (Apple nunca devuelve la clave
        # privada de un certificado ya creado, así que la aportamos nosotros).
        - ios_signing
      vars:
        BUNDLE_ID: "app.forzaai.mobile"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Instalar dependencias
        script: |
          # El "pnpm" de esta imagen es un shim de corepack, que tiene dos
          # bugs distintos (verificación de firmas y un ERR_VM_DYNAMIC_
          # IMPORT_CALLBACK_MISSING al ejecutar la versión descargada).
          # Instalamos el pnpm real vía npm, forzando para pisar el shim.
          npm install -g pnpm@11.25.0 --force
          pnpm install --frozen-lockfile
      - name: Sincronizar Capacitor (iOS)
        script: |
          npx cap sync ios
      - name: Configurar firma automática (App Store Connect API)
        script: |
          keychain initialize
          # CERTIFICATE_PRIVATE_KEY_B64 está en base64 (una sola línea) porque
          # el campo de variables de Codemagic no preserva bien los saltos de
          # línea de una clave PEM pegada directamente. La decodificamos a un
          # archivo temporal y la pasamos por @file: en vez de por variable.
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/ios_distribution_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:/tmp/ios_distribution_key.pem" \
            --create
          rm -f /tmp/ios_distribution_key.pem
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Compilar y exportar el .ipa
        script: |
          # Apple rechaza subir un .ipa con la misma versión + número de
          # build que uno ya subido antes ("attribute already used").
          # Tomamos el último número usado en App Store Connect y sumamos 1,
          # pasándolo directo a xcodebuild (más confiable que agvtool, que
          # necesita el "Versioning System" habilitado en el proyecto).
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$BUNDLE_ID")
          BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Poné en true cuando ya quieras que cada build suba directo a
        # revisión de App Store (además de TestFlight). Mientras se arma
        # la ficha, dejalo en false y subí a revisión manualmente desde
        # App Store Connect cuando esté todo listo.
        submit_to_app_store: false
